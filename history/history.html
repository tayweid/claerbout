          const paused = k.blocked || (g.state === 'paused' ? g.reason : null);
          const after = (() => { const anchor = c.kind === 'user' ? c.tie && find(c.tie.sha) : c; return anchor && anchor.i != null ? S.data.records.length - 1 - anchor.i : null; })();
          const back = c.day === today() ? `${spanWords(Date.now() - c.t)} back` : dayInfo(c.day).short;
          const entries = [...k.write.map((e) => [e, false]), ...k.remove.map((p) => [{ path: p, status: 'D' }, true])];
          if (!entries.length) {
            return `<div class="sec"><div class="sl">Rewinding here</div><div class="fn">This is where you are: the files now are this commit’s${k.kept && k.kept.length && !k.onRecord ? ', and the files it does not hold stay as they are' : ''}.</div>${skippedHTML(k)}</div>
              <div class="act"><button class="rw" type="button" disabled>${BACK} You are here</button></div>`;
          }
          const rowsH = entries.map(([e, removed]) => backHTML(e, S.card.back.get(e.path), c, removed)).join('');
          const man = k.untracked
            ? `<div class="nr fixed"><span class="nb"><span class="fp">untracked/</span><span class="nn">stays as it is: the record keeps only names and hashes there${k.untrackedGone.length ? `; ${esc(listNames(k.untrackedGone.map(base), 2))} cannot come back` : ''}</span></span></div>`
            : '';
          const kept = k.kept && k.kept.length
            ? k.onRecord
              ? `<div class="same">${esc(listNames(k.kept.map(base), 2))} ${k.kept.length === 1 ? 'is' : 'are'} new since the record last committed, so ${k.kept.length === 1 ? 'it stays' : 'they stay'}.</div>`
              : `<div class="same">${k.kept.length > 2 ? plural(k.kept.length, 'file') : esc(k.kept.join(' and '))} ${k.kept.length === 1 ? 'is' : 'are'} not in this commit, so ${k.kept.length === 1 ? 'it stays' : 'they stay'} as now.</div>`
            : '';

          const held = (k.others || []).map((o) => ({ app: o.app, docs: o.documents.map(relative).filter((p) => touchedSet.has(p)) })).filter((o) => o.docs.length);
          const otherH = held.length
            ? `<div class="other"><b>${esc(listNames(held[0].docs.map(base)))} ${held[0].docs.length === 1 ? 'is' : 'are'} open in ${esc(capital(held[0].app))}</b>, a separate app, so it is not saved first. Close it there or untick it; rewound anyway, ${esc(capital(held[0].app))} reloads it when it sees the rewind.</div>`
            : '';
          const same = k.same > 0 ? `${plural(k.same, 'other file is', 'other files are')} the same at both moments.` : '';
          // This app's windows on the project: each is asked to save first; only the ones whose
          // documents the rewind writes or removes reload.
          const ownPaths = (g.windows || []).map(relative);
          const reloading = ownPaths.filter((p) => touchedSet.has(p)).map(base);

          const refusal = S.card.refusal;

            <div class="same">${same}</div>${kept}${skippedHTML(k)}${otherH}</div>${action}`;
        }
        function skippedHTML(k) {
          if (!k.skipped || !k.skipped.length) return '';
          return k.skipped.slice(0, 6).map((s) => `<div class="nr fixed"><span class="nb"><span class="fp">${esc(s.path)}</span><span class="nn">left as it is: ${esc(s.why)}</span></span></div>`).join('');
        }

        /* ---------- rewind ---------- */
        function chosenPaths() {
          const boxes = $$('#card input[data-path]');
          const on = boxes.filter((b) => b.checked).map((b) => b.dataset.path);
          return on.length === boxes.length ? null : on;
        }
        function stepsHTML(c, k, paths) {
          const g = S.graph;
          const app = capital(g.app);
          const own = (g.windows || []).map(base);
          const n = paths ? paths.length : k.write.length + k.remove.length;
          const others = (g.others || []).filter((o) => o.documents.length);
          const target = c.sha;
          // Only the documents this rewind writes or removes reload.
          const rewinding = new Set(paths || [...k.write.map((x) => x.path), ...k.remove]);
          const reloading = (g.windows || []).map(relative).filter((p) => rewinding.has(p)).map(base);
          const labels = {
            save: own.length ? `Save ${esc(listNames(own, 2))} in ${esc(app)}` : `No ${esc(app)} window on this project to save`,
            'record-from': `Record now: <span class="sha">${esc(g.app)}: rewind from ${short(k.tip)}</span>`,
            write: `Write ${plural(n, 'file')} from <span class="sha">${short(target)}</span> into the folder`,
            'record-to': `Record <span class="sha">${esc(g.app)}: rewind to ${short(target)}</span>`,
            reload: `${reloading.length ? `Reload ${esc(listNames(reloading, 2))}` : 'Nothing open here is rewound, so nothing reloads'}${others.length ? `; ${esc(capital(others[0].app))} reloads its files when it sees the rewind` : ''}`,
          };
          return `<ol class="steps">${STEP_ORDER.map((s) => `<li data-step="${s}">${labels[s]}</li>`).join('')}</ol>`;
        }
        function onStep(detail) {
          const li = card.querySelector(`.steps li[data-step="${detail.step}"]`);
          if (!li) return;
          const i = STEP_ORDER.indexOf(detail.step);
          $$('.steps li', card).forEach((x, j) => { if (j < i && !x.classList.contains('done')) { x.classList.remove('doing'); x.classList.add('done'); } });
          li.classList.toggle('doing', detail.state === 'doing');
          li.classList.toggle('done', detail.state === 'done');
          if (detail.step === 'record-from' && detail.state === 'done' && detail.detail && detail.detail.from === null) li.innerHTML = 'Now was the tip: nothing to record first';
          // A window that did not answer save was not saved first, and will not reload: said in amber.
          const silent = detail.state === 'done' && detail.detail && Array.isArray(detail.detail.silent) ? detail.detail.silent.map(base) : [];
          if (silent.length && detail.step === 'save') {
            li.classList.add('warn');
            li.textContent = `${listNames(silent, 2)} did not answer: not saved first`;
          }
          if (silent.length && detail.step === 'reload') {
            li.classList.add('warn');
            li.textContent = `Reopen ${listNames(silent, 2)}: ${silent.length === 1 ? 'its window' : 'their windows'} did not answer, so ${silent.length === 1 ? 'it does' : 'they do'} not reload`;
          }
          showSteps();

        function bedSVG(ys) {
          const h = ys.length ? Math.max(210, ys[ys.length - 1] + 46) : 170;
          const squares = ys.map((y) => `<rect x="44.5" y="${y - 5.5}" width="11" height="11" rx="3" fill="#2b2a2d" stroke="#d8d6d1" stroke-width="1.6"/>`).join('');
          const trib = ys.length > 1 ? `<line class="trib" x1="50" y1="${ys[0]}" x2="50" y2="${ys[ys.length - 1]}"/>` : '';
          return `<svg width="70" height="${h}" viewBox="0 0 70 ${h}">
              <line class="riv dot" x1="22" y1="12" x2="22" y2="${h - 18}"/>
              <circle cx="22" cy="12" r="4.5" fill="none" stroke="rgba(157,184,214,0.55)" stroke-width="1.5"/>
              <circle cx="22" cy="${h - 14}" r="6.5" fill="#2b2a2d" stroke="rgba(157,184,214,0.8)" stroke-width="1.5" stroke-dasharray="2.6 2.2"/>
              ${trib}${squares}
            </svg>`;
        }
        function placeBed() {
          const svg = $('#empty .bed svg'), items = $$('#empty .ucs li');
          if (!svg || !items.length) return;
          const top = svg.getBoundingClientRect().top;
          const ys = items.map((li) => { const r = li.getBoundingClientRect(); return Math.round(r.top + r.height / 2 - top); });
          svg.outerHTML = bedSVG(ys);
        }
        function emptyHTML(v, g) {
          const app = capital((g && g.app) || 'the app');
          const doc = g && g.document ? base(g.document) : null;
          const prefix = app.toUpperCase();
          const users = g && g.commits ? g.commits.filter((c) => c.line !== 'record').slice(0, 3).reverse() : [];
          const V = {
            unsaved: { main: false, title: 'Not saved yet', body: `<p>${doc ? `<b>${esc(doc)}</b>` : 'This document'} is not in a folder yet, so there is nothing to record. Save it in a folder of its own, like ~/Projects/week-4, and the record begins at once: its first commit lands as the window moves onto the folder, and from then on every cell run and every minute something changes.</p><p>Each will be a point on this line, and you can go back to any of them.</p>`, foot: 'the record follows the git repository the document’s folder is in, and makes one where there is none' },
            refused: { main: false, title: 'No record here', body: `<p>${doc ? `<b>${esc(doc)}</b>` : 'This document'} has no record: ${esc((g && g.detail) || 'its folder is not one the record keeps')}.</p><p>In a folder of its own, like ~/Documents/week-3, it is recorded from the moment it opens.</p>`, foot: 'never the home folder or its standard folders, a cloud-synced root, a temporary folder, or where credentials are kept' },
            off: { main: false, title: 'The record is off', body: `<p>Autosave is off for ${esc(app)}, so nothing is being recorded${doc ? ` for <b>${esc(doc)}</b>` : ''}, and there is nothing to go back to.</p>`, foot: `"autosave": true in the app’s config turns it on · ${esc(prefix)}_AUTOSAVE=0 turns it off for a test` },
            'no-git': { main: false, title: 'No git on this Mac', body: `<p>The record is kept with git, and ${esc(app)} found none. On a Mac, the developer tools bring it: <b>xcode-select --install</b> in a terminal, then open the document again.</p>`, foot: 'the record looks for git in the app’s PATH, Homebrew’s folders and /usr/bin' },
            waiting: { main: users.length > 0, title: 'Waiting to begin', body: `<p><b>${esc(g && g.project ? g.project.name : 'This project')}</b> has no record yet, and ${esc((g && g.reason) || 'git is at work')}, so its first commit waits. It lands when that ends${users.length ? ', beside your branch, tied to it wherever they hold the same files' : ''}.</p>${users.length ? `<ul class="ucs">${users.map((u) => `<li><span class="t">${esc(dayInfo(dayKey(Date.parse(u.time))).short)}</span><span class="m">${esc(u.subject)}</span></li>`).join('')}</ul>` : ''}`, foot: `${esc(g && g.project ? g.project.branch : 'claerbout-autosave')}: no commits yet · paused while git is at work` },
            begins: { main: false, title: 'The record begins', body: `<p><b>${esc(g && g.project ? g.project.name : 'This project')}</b> has no record commit yet. The first lands when a window moves onto the project, then every cell run and every minute something changes.</p>`, foot: `${esc(g && g.project ? g.project.branch : 'claerbout-autosave')}: no commits yet` },
            error: { main: false, title: 'The history could not be read', body: `<p>${esc((g && g.error) || 'The shell did not answer.')}</p><p>The record itself is untouched; the log has more.</p>`, foot: shell ? 'View › Reload tries again' : 'this page is the shell’s own: open it from the app, View › History…' },
          }[v] || null;
          const view = V || { main: false, title: 'No record here', body: `<p>${esc(String(v))}</p>`, foot: '' };
          const ys = view.main ? users.map((_u, k) => 40 + k * 55) : [];
          return `<div class="em"><div class="bed">${bedSVG(ys)}</div><div><h2>${view.title}</h2>${view.body}<div class="foot">${view.foot}</div></div></div>`;
        }
        function showEmpty(v, g) {
          S.data = null;
          scroll.hidden = true;
          mini.hidden = true;
          card.hidden = true;
          const e = $('#empty');
          e.hidden = false;
          e.innerHTML = emptyHTML(v, g);
          placeBed();
          setPath(g && g.project ? g.project.display : g && g.document ? base(g.document) : '');
          $('#t-meta').textContent = v === 'off' || v === 'no-git' ? 'record off' : v === 'unsaved' || v === 'refused' ? 'no record' : g && g.project ? `no commits yet · ${g.project.branch}` : '';
          if (g && !g.error) { S.graph = g; paintHere(); paintRec(); }
          fitPath();
          $$('#zoom button').forEach((b) => { b.disabled = true; b.classList.remove('on'); });
          $('#rb-branch').disabled = true;
        }

        if (!shell) showEmpty('error', null);
        else void loadGraph({ keep: false });
      })();
    </script>
  </body>
</html>
