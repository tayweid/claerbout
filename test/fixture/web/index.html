<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"
    />
    <title>Fixture</title>
    <style>
      /* The suite's frame in miniature: a bar in the lights' band with a
         History tile, and the room below it, where the shell lays the
         History page when the tile is pressed. */
      :root { --bar: env(titlebar-area-height, 44px); }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body { background: #18181a; color: #d5d3cf; font: 14px system-ui; }
      #bar {
        position: absolute; top: 0; left: 0; right: 0; height: var(--bar); display: flex; align-items: center; gap: 6px;
        padding: 0 8px 0 calc(env(titlebar-area-x, 0px) + 8px); -webkit-app-region: drag;
      }
      #bar > * { -webkit-app-region: no-drag; }
      #name { height: 30px; border-radius: 8px; background: #232326; display: flex; align-items: center; padding: 0 12px; font-size: 12px; }
      #history {
        width: 32px; height: 32px; border: 0; border-radius: 9px; background: transparent; color: rgba(240, 238, 233, 0.64);
        display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
      }
      #history:hover { background: #252528; color: #d5d3cf; }
      #history.on { background: #2e2e32; color: #d5d3cf; }
      #history svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      #room {
        position: absolute; top: var(--bar); left: 8px; right: 8px; bottom: 8px; border-radius: 12px; background: #f4f2ee; color: #222;
        padding: 16px 20px; box-sizing: border-box; overflow: auto;
      }
      pre { border: 1px solid #ccc; padding: 8px; min-height: 4em; }
    </style>
  </head>
  <body>
    <div id="bar">
      <div id="name">Fixture</div>
      <button id="history" type="button" aria-pressed="false" title="History">
        <svg viewBox="0 0 24 24"><polyline points="3 4 3 10 9 10" /><path d="M3.8 15a8.5 8.5 0 1 0 1.9-8.8L3 10" /><polyline points="12 7.5 12 12 15 14" /></svg>
      </button>
    </div>
    <main id="room">
      <p>A page with no Python: the shell's window, its files by path, its dialogs.</p>
      <p>Status: <b id="status">starting</b></p>
      <pre id="text"></pre>
      <button id="save" type="button">Save a copy beside it</button>
      <button id="open" type="button">Open…</button>
    </main>
    <script src="./index.js"></script>
  </body>
</html>
